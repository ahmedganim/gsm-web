<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ==================== نظام الحماية والمصادقة ==================== -->
    <script src="auth.js"></script>
    <script>GSMAuth.guard();</script>
    <link rel="stylesheet" href="auth.css">

    <meta name="description" content="دليل الشركات المصنعة للأجهزة الذكية في قاعدة البيانات.">
    <meta name="theme-color" content="#0f172a">
    <title>دليل الشركات المصنعة | GSM Devices</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==================== الهيدر ==================== -->
    <header class="top-header">
        <div class="header-content">
            <div class="title-group">
                <h1>دليل الشركات المصنعة</h1>
                <p>اضغط على أي شركة لاستعراض الأجهزة الخاصة بها فقط</p>
            </div>
        </div>
    </header>

    <!-- ==================== المحتوى ==================== -->
    <main class="vendors-page">
        <div class="back-bar">
            <a href="index.html" class="back-link">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor"
                          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                العودة لكافة الأجهزة
            </a>
        </div>

        <!-- شريط أدوات البحث -->
        <div class="vendors-toolbar">
            <div class="vendor-search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M21 21l-4.35-4.35M17 11a6 6 0 1 1-12 0 6 6 0 0 1 12 0z"
                          stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <input
                    type="text"
                    id="vendorSearch"
                    placeholder="ابحث عن شركة مصنعة..."
                    autocomplete="off"
                    aria-label="بحث في الشركات"
                >
            </div>
            <span id="vendorStats" class="stats-text" aria-live="polite"></span>
        </div>

        <!-- شبكة الشركات -->
        <div id="vendorsContainer" class="vendors-grid"></div>
    </main>

    <script src="data.js" defer></script>
</body>
</html>
