<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>تسجيل الدخول | GSM Devices</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-bg-decor" aria-hidden="true"></div>

    <div class="login-container">
        <div class="login-card">

            <div class="login-logo" aria-hidden="true">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
                    <rect x="6" y="2" width="12" height="20" rx="2.5"
                          stroke="currentColor" stroke-width="2"/>
                    <circle cx="12" cy="18" r="1.2" fill="currentColor"/>
                </svg>
            </div>

            <h1>مرحباً بعودتك</h1>
            <p class="login-subtitle">سجّل الدخول للوصول إلى قاعدة بيانات الأجهزة الذكية</p>

            <form id="loginForm" class="login-form" novalidate>

                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="user أو admin"
                        autocomplete="username"
                        autocapitalize="none"
                        spellcheck="false"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            aria-label="إظهار كلمة المرور"
                            aria-pressed="false"
                        >
                            <span class="eye-open" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                                          stroke="currentColor" stroke-width="2"/>
                                    <circle cx="12" cy="12" r="3"
                                            stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </span>
                            <span class="eye-closed" aria-hidden="true">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"
                                          stroke="currentColor" stroke-width="2"
                                          stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                        </button>
                    </div>
                </div>

                <div id="loginError" class="login-error" role="alert" style="display:none;"></div>

                <button type="submit" class="login-btn">
                    تسجيل الدخول
                </button>
            </form>

            <div class="demo-creds">
                <p>بيانات الدخول التجريبية</p>
                <div class="cred-row">
                    <span>👤 مستخدم عادي</span>
                    <code>user / user</code>
                </div>
                <div class="cred-row">
                    <span>👨‍💼 مدير النظام</span>
                    <code>admin / admin</code>
                </div>
            </div>

        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
